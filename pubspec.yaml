name: nannan_merchant
description: Nan-Nan Connect — Espace Marchand (Flutter + Supabase)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  package_info_plus: ^10.0.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  video_player: ^2.9.2

  # Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#FCFBF8"
  image: assets/images/logo_anl.png
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
